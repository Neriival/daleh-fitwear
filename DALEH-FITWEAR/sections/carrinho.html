<!-- FUNDO ESCURO -->

<div class="cart-overlay" id="cart-overlay"></div>


<!-- CARRINHO LATERAL -->

<aside
    class="cart-sidebar"
    id="cart-sidebar"
    aria-label="Carrinho de compras"
>

    <!-- CABEÇALHO -->

    <div class="cart-header">

        <div>

            <span class="cart-eyebrow">
                DALEH FITWEAR
            </span>

            <h2>
                Seu carrinho
            </h2>

        </div>


        <button
            class="cart-close"
            id="cart-close"
            type="button"
            aria-label="Fechar carrinho"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>


    <!-- PRODUTOS -->

    <div
        class="cart-items"
        id="cart-items"
    ></div>


    <!-- CARRINHO VAZIO -->

    <div
        class="cart-empty"
        id="cart-empty"
    >

        <i class="fa-solid fa-bag-shopping"></i>

        <h3>
            Seu carrinho está vazio
        </h3>

        <p>
            Escolha suas peças favoritas
            e adicione ao carrinho.
        </p>

        <button
            class="cart-continue"
            id="cart-continue"
            type="button"
        >
            VER PRODUTOS
        </button>

    </div>


    <!-- RODAPÉ -->

    <div
        class="cart-footer"
        id="cart-footer"
    >

        <div class="cart-summary">

            <div>
                <span>Subtotal</span>

                <strong id="cart-subtotal">
                    R$ 0,00
                </strong>
            </div>

            <div class="cart-total">

                <span>Total</span>

                <strong id="cart-total">
                    R$ 0,00
                </strong>

            </div>

        </div>


        <p class="cart-whatsapp-info">

            <i class="fa-brands fa-whatsapp"></i>

            O pagamento e a entrega serão
            combinados diretamente pelo WhatsApp.

        </p>


        <button
            class="cart-whatsapp-button"
            id="checkout-whatsapp"
            type="button"
        >

            <i class="fa-brands fa-whatsapp"></i>

            FINALIZAR PELO WHATSAPP

        </button>

    </div>

</aside>
