<section class="products" id="produtos">

    <div class="container">

        <!-- =============================================
             CABEÇALHO
        ============================================== -->

        <div class="products-heading">

            <span class="products-eyebrow">
                DALEH FITWEAR
            </span>

            <h2>
                Nossos
                <span>favoritos.</span>
            </h2>

            <p>
                Peças escolhidas para acompanhar você
                do treino à rotina com conforto e estilo.
            </p>

        </div>


        <!-- =============================================
             FILTROS
        ============================================== -->

        <div class="products-filters">

            <button
                class="product-filter active"
                data-filter="todos"
                type="button"
            >
                Todos
            </button>

            <button
                class="product-filter"
                data-filter="conjuntos"
                type="button"
            >
                Conjuntos
            </button>

            <button
                class="product-filter"
                data-filter="tops"
                type="button"
            >
                Tops
            </button>

            <button
                class="product-filter"
                data-filter="calcas"
                type="button"
            >
                Calças
            </button>

            <button
                class="product-filter"
                data-filter="shorts"
                type="button"
            >
                Shorts
            </button>

            <button
                class="product-filter"
                data-filter="macacao"
                type="button"
            >
                Macacão
            </button>

            <button
                class="product-filter"
                data-filter="macaquinho"
                type="button"
            >
                Macaquinho
            </button>

            <button
                class="product-filter"
                data-filter="blusa"
                type="button"
            >
                Blusa
            </button>

            <button
                class="product-filter"
                data-filter="casaco"
                type="button"
            >
                Casaco
            </button>

            <button
                class="product-filter"
                data-filter="bolsas"
                type="button"
            >
                Bolsas
            </button>

            <button
                class="product-filter"
                data-filter="meias"
                type="button"
            >
                Meias
            </button>

        </div>


        <!-- =============================================
             PRODUTOS (GERADOS PELO JS)
        ============================================== -->

        <div
            class="products-grid"
            id="products-grid"
        ></div>


        <!-- =============================================
             BOTÃO VER MAIS
        ============================================== -->

        <div class="products-more">

            <button
                class="products-more-button"
                id="products-more"
                type="button"
            >

                VER MAIS PRODUTOS

                <i class="fa-solid fa-arrow-down"></i>

            </button>

        </div>

    </div>

</section>
