<section
    class="campaign"
    id="campaign-section"
>
    <div class="container">

        <div
            class="campaign-slider"
            id="campaign-slider"
        >

            <button
                class="campaign-arrow campaign-prev"
                id="campaign-prev"
                type="button"
                aria-label="Campanha anterior"
            >
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <a
                class="campaign-link"
                id="campaign-link"
                href="#produtos"
            >
                <img
                    class="campaign-image"
                    id="campaign-image"
                    src=""
                    alt="Campanha DALEH FITWEAR"
                >
            </a>

            <button
                class="campaign-arrow campaign-next"
                id="campaign-next"
                type="button"
                aria-label="Próxima campanha"
            >
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <div
                class="campaign-dots"
                id="campaign-dots"
            ></div>

        </div>

    </div>
</section>
